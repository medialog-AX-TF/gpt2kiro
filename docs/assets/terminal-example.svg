    <text x="70" y="435" fill="#58a6ff">== 3/3 Create first project ==</text>
    <text x="70" y="480">Project created and activated.</text>
    <text x="70" y="535" fill="#7ee787">PS&gt;</text><text x="130" y="535"> .\.kiro\scripts\use-project.ps1 -List</text>
    <text x="70" y="580">* my-first-project   chats: 0</text>
  </g>
</svg>