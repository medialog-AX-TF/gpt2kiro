<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="gpt2kiro terminal quick start example">
  <rect width="1200" height="650" rx="24" fill="#0d1117"/>
  <rect x="30" y="30" width="1140" height="590" rx="18" fill="#161b22" stroke="#30363d"/>
  <circle cx="65" cy="65" r="9" fill="#ff5f56"/><circle cx="95" cy="65" r="9" fill="#ffbd2e"/><circle cx="125" cy="65" r="9" fill="#27c93f"/>
  <text x="155" y="72" font-family="Consolas, monospace" font-size="22" fill="#c9d1d9">PowerShell - gpt2kiro quick start</text>
  <g font-family="Consolas, monospace" font-size="26" fill="#c9d1d9">
    <text x="70" y="135" fill="#7ee787">PS&gt;</text><text x="130" y="135"> .\setup.ps1</text>
    <text x="70" y="190" fill="#58a6ff">== 1/3 Install workspace hook ==</text>
    <text x="70" y="235">gpt2kiro unified context hook installed.</text>
    <text x="70" y="290" fill="#58a6ff">== 2/3 Validate workspace ==</text>
    <text x="70" y="335">[OK] required files, budget, and unified hook checks passed.</text>
